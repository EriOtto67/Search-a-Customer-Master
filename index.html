<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両検索</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #ffffff;
      color: #333;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0;
    }

    /* ==============================
       ヘッダー
    ============================== */

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      margin: 0;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .subtitle {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }


    /* ==============================
       検索エリア
    ============================== */

    .search-area {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      top: 30px;
      left: 20px;
      transform: translateY(-50%);
      color: #00b84f;
      font-size: 22px;
      pointer-events: none;
      z-index: 2;
    }

    #searchInput {
      width: 100%;
      height: 60px;
      padding: 0 25px 0 55px;

      border: 2px solid #d5d5d5;
      border-radius: 30px;

      background: #fff;
      color: #333;

      font-size: 18px;

      outline: none;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    #searchInput:hover {
      border-color: #00c853;
    }

    #searchInput:focus {
      border-color: #00c853;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.05),
        0 0 0 4px rgba(0, 200, 83, 0.12);
    }

    #searchInput::placeholder {
      color: #aaa;
    }

    .example {
      margin-top: 10px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }


    /* ==============================
       検索状態
    ============================== */

    #status {
      min-height: 26px;
      margin-top: 34px;

      color: #666;

      font-size: 14px;
      font-weight: 500;
    }


    /* ==============================
       検索結果
    ============================== */

    #results {
      display: grid;
      gap: 14px;
    }


    /* ==============================
       結果カード
    ============================== */

    .result-card {
      position: relative;

      background: #fff;

      border: 1px solid #e2e2e2;
      border-top: 5px solid #00c853;

      border-radius: 12px;

      padding: 20px 55px 20px 22px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        border-color 0.15s;
    }

    .result-card:hover {
      transform: translateY(-2px);

      border-top-color: #00b84f;

      box-shadow:
        0 6px 18px rgba(0, 184, 79, 0.14);
    }


    /* ==============================
       登録番号
    ============================== */

    .registration {
      margin-bottom: 16px;

      color: #00b84f;

      font-size: 23px;
      font-weight: 700;

      letter-spacing: 0.03em;
    }


    /* ==============================
       顧客・車両情報
    ============================== */

    .info-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px 12px;
      align-items: center;
    }

    .label {
      color: #888;
      font-size: 13px;
    }

    .value {
      color: #333;

      font-size: 16px;
      font-weight: 500;
    }


    /* ==============================
       担当SS
    ============================== */

    .ss-badge {
      display: inline-block;

      width: fit-content;

      padding: 4px 11px;

      color: #00883b;
      background: #f0f8f3;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 600;
    }


    /* ==============================
       カード右側矢印
    ============================== */

    .arrow {
      position: absolute;

      right: 22px;
      top: 50%;

      transform: translateY(-50%);

      color: #00b84f;

      font-size: 28px;
      font-weight: 300;
    }


    /* ==============================
       0件
    ============================== */

    .no-result {
      padding: 35px 20px;

      text-align: center;

      color: #777;
      background: #fff;

      border: 1px solid #e2e2e2;
      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.04);
    }


    /* ==============================
       スマホ
    ============================== */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 24px);
        padding: 38px 0;
      }

      .title {
        font-size: 25px;
      }

      .subtitle {
        font-size: 13px;
      }

      #searchInput {
        height: 56px;
        font-size: 16px;
      }

      .search-icon {
        top: 28px;
      }

      .result-card {
        padding:
          18px
          45px
          18px
          18px;
      }

      .registration {
        font-size: 20px;
      }

      .info-grid {
        grid-template-columns: 65px 1fr;
        gap: 7px 8px;
      }

      .value {
        font-size: 15px;
      }

      .arrow {
        right: 16px;
      }
    }
  </style>
</head>


<body>

  <main class="container">

    <!-- ============================
         ヘッダー
    ============================= -->

    <div class="header">

      <h1 class="title">
        車両検索
      </h1>

      <div class="subtitle">
        登録番号から顧客マスタを検索
      </div>

    </div>


    <!-- ============================
         検索
    ============================= -->

    <div class="search-area">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="登録番号を入力"
      >

      <div class="example">
        入力例： 1234 / あ1234
      </div>

    </div>


    <!-- ============================
         検索状態
    ============================= -->

    <div id="status"></div>


    <!-- ============================
         検索結果
    ============================= -->

    <div id="results"></div>

  </main>


  <script>

    // =========================================================
    // 設定
    // =========================================================

    const API_URL = "";


    // =========================================================
    // DOM
    // =========================================================

    const searchInput =
      document.getElementById("searchInput");

    const results =
      document.getElementById("results");

    const status =
      document.getElementById("status");


    // =========================================================
    // 入力監視
    // =========================================================

    let searchTimer = null;


    searchInput.addEventListener("input", () => {

      clearTimeout(searchTimer);


      const keyword =
        searchInput.value.trim();


      // 入力が空なら結果を消す
      if (!keyword) {

        results.innerHTML = "";
        status.textContent = "";

        return;

      }


      // 連続入力のたび通信しないよう300ms待つ
      searchTimer = setTimeout(() => {

        searchVehicle(keyword);

      }, 300);

    });


    // =========================================================
    // 車両検索
    // =========================================================

    async function searchVehicle(keyword) {

      status.textContent =
        "検索中...";

      results.innerHTML = "";


      try {

        /*
        =========================================================
        Power Automate接続後はこちらを使用
        =========================================================

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            keyword: keyword
          })

        });


        if (!response.ok) {

          throw new Error(
            "検索に失敗しました"
          );

        }


        const data =
          await response.json();


        renderResults(
          data.records
        );

        =========================================================
        */


        // =====================================================
        // 現在は動作確認用の仮データ
        // =====================================================

        const dummyRecords = [

          {
            recordId: "12345",
            name: "山田 太郎",
            ss: "八日市SS",
            carName: "プリウス",
            registrationNumber: "滋賀580あ1234"
          },

          {
            recordId: "12346",
            name: "田中 一郎",
            ss: "守山SS",
            carName: "タント",
            registrationNumber: "滋賀501さ8123"
          },

          {
            recordId: "12347",
            name: "佐藤 花子",
            ss: "近江八幡SS",
            carName: "N-BOX",
            registrationNumber: "滋賀330す1230"
          }

        ];


        // =====================================================
        // 部分一致検索
        // =====================================================

        const normalizedKeyword =
          normalizeText(keyword);


        const filtered =
          dummyRecords.filter(record => {

            const registrationNumber =
              normalizeText(
                record.registrationNumber
              );


            return registrationNumber.includes(
              normalizedKeyword
            );

          });


        renderResults(filtered);

      }

      catch (error) {

        console.error(error);


        status.textContent =
          "検索中にエラーが発生しました。";

      }

    }


    // =========================================================
    // 検索結果表示
    // =========================================================

    function renderResults(records) {

      results.innerHTML = "";


      // =======================================================
      // 0件
      // =======================================================

      if (
        !records ||
        records.length === 0
      ) {

        status.textContent = "";


        results.innerHTML = `
          <div class="no-result">
            該当する車両はありません。
          </div>
        `;


        return;

      }


      // =======================================================
      // 件数
      // =======================================================

      status.textContent =
        `${records.length}件見つかりました`;


      // =======================================================
      // カード生成
      // =======================================================

      records.forEach(record => {


        const card =
          document.createElement("div");


        card.className =
          "result-card";


        /*
         * kintoneのレコード番号
         *
         * 画面には表示しない。
         * 各カード内部に保持する。
         */

        card.dataset.recordId =
          record.recordId;


        card.innerHTML = `

          <div class="registration">

            ${escapeHtml(
              record.registrationNumber
            )}

          </div>


          <div class="info-grid">


            <div class="label">
              氏名
            </div>

            <div class="value">

              ${escapeHtml(
                record.name
              )}

            </div>


            <div class="label">
              車名
            </div>

            <div class="value">

              ${escapeHtml(
                record.carName
              )}

            </div>


            <div class="label">
              担当SS
            </div>

            <div class="value">

              <span class="ss-badge">

                ${escapeHtml(
                  record.ss
                )}

              </span>

            </div>


          </div>


          <div class="arrow">
            ›
          </div>

        `;


        // =====================================================
        // カードクリック
        // =====================================================

        card.addEventListener(
          "click",
          () => {


            const recordId =
              card.dataset.recordId;


            console.log(
              "選択されたレコード番号:",
              recordId
            );


            console.log(
              "選択されたレコード:",
              record
            );


            /*
             * 今後ここから
             *
             * ・顧客詳細
             * ・車両詳細
             * ・関連アプリ
             *
             * へ展開する。
             */

          }
        );


        results.appendChild(card);

      });

    }


    // =========================================================
    // 検索文字正規化
    // =========================================================

    function normalizeText(value) {

      return String(
        value ?? ""
      )
        .normalize("NFKC")
        .replace(/\s+/g, "")
        .toLowerCase();

    }


    // =========================================================
    // HTMLエスケープ
    // =========================================================

    function escapeHtml(value) {

      const div =
        document.createElement("div");


      div.textContent =
        value ?? "";


      return div.innerHTML;

    }

  </script>

</body>
</html>
