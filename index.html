<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両検索</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #ffffff;
      color: #333;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0;
    }

    /* ==============================
       ヘッダー
    ============================== */

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      margin: 0;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ==============================
       検索エリア
    ============================== */

    .search-area {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      top: 30px;
      left: 20px;
      transform: translateY(-50%);
      color: #00b84f;
      font-size: 22px;
      pointer-events: none;
      z-index: 2;
    }

    #searchInput {
      width: 100%;
      height: 60px;
      padding: 0 25px 0 55px;

      border: 2px solid #d5d5d5;
      border-radius: 30px;

      background: #fff;
      color: #333;

      font-size: 18px;

      outline: none;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    #searchInput:hover {
      border-color: #00c853;
    }

    #searchInput:focus {
      border-color: #00c853;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.05),
        0 0 0 4px rgba(0, 200, 83, 0.12);
    }

    #searchInput::placeholder {
      color: #aaa;
    }

    /* ==============================
       検索状態
    ============================== */

    #status {
      min-height: 26px;
      margin-top: 34px;

      color: #666;

      font-size: 14px;
      font-weight: 500;
    }


    /* ==============================
       検索結果
    ============================== */

    #results {
      display: grid;
      gap: 14px;
    }


    /* ==============================
       結果カード
    ============================== */

    .result-card {
      position: relative;

      background: #fff;

      border: 1px solid #e2e2e2;
      border-top: 5px solid #00c853;

      border-radius: 12px;

      padding: 20px 55px 20px 22px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        border-color 0.15s;
    }

    .result-card:hover {
      transform: translateY(-2px);

      border-top-color: #00b84f;

      box-shadow:
        0 6px 18px rgba(0, 184, 79, 0.14);
    }


    /* ==============================
       登録番号
    ============================== */

    .registration {
      margin-bottom: 16px;

      color: #00b84f;

      font-size: 23px;
      font-weight: 700;

      letter-spacing: 0.03em;
    }


    /* ==============================
       顧客・車両情報
    ============================== */

    .info-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px 12px;
      align-items: center;
    }

    .label {
      color: #888;
      font-size: 13px;
    }

    .value {
      color: #333;

      font-size: 16px;
      font-weight: 500;
    }

    /* ==============================
       カード右側矢印
    ============================== */

    .arrow {
      position: absolute;

      right: 22px;
      top: 50%;

      transform: translateY(-50%);

      color: #00b84f;

      font-size: 28px;
      font-weight: 300;
    }

    /* ==============================
   操作ボタン
============================== */

.action-buttons {
  display: flex;
  gap: 10px;
  margin: 20px 0 4px;
}

.action-button {
  flex: 1;

  padding: 11px 10px;

  background: #ffffff;
  color: #00b84f;

  border: 2px solid #00b84f;
  border-radius: 8px;

  font-size: 14px;
  font-weight: 700;

  cursor: pointer;

  transition:
    background-color 0.15s,
    color 0.15s,
    transform 0.15s;
}

.action-button:hover {
  background: #00b84f;
  color: #ffffff;
  transform: translateY(-1px);
}

.action-button:active {
  transform: translateY(0);
}

    /* ==============================
   対応履歴
============================== */

.history-area {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #e2e2e2;
}

.history-title {
  margin-bottom: 16px;

  color: #00b84f;

  font-size: 23px;
  font-weight: 700;

  letter-spacing: 0.03em;
}
    
.history-list {
  display: grid;
  gap: 0;
}

.history-item {
  padding: 12px 0;
  border-bottom: 1px solid #eeeeee;
}

.history-item:last-child {
  border-bottom: none;
}

.history-content {
  color: #333;

  font-size: 16px;
  font-weight: 500;

  line-height: 1.6;
  white-space: pre-wrap;
}

.history-loading,
.history-empty {
  color: #777;
  font-size: 14px;
}

.history-error {
  color: #c62828;
  font-size: 14px;
}

    /* ==============================
       0件
    ============================== */

    .no-result {
      padding: 35px 20px;

      text-align: center;

      color: #777;
      background: #fff;

      border: 1px solid #e2e2e2;
      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* ==============================
       スマホ
    ============================== */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 24px);
        padding: 38px 0;
      }

      .title {
        font-size: 25px;
      }

      #searchInput {
        height: 56px;
        font-size: 16px;
      }

      .search-icon {
        top: 28px;
      }

      .result-card {
        padding:
          18px
          45px
          18px
          18px;
      }

      .registration {
        font-size: 20px;
      }

      .history-title {
  font-size: 20px;
}

      .info-grid {
        grid-template-columns: 65px 1fr;
        gap: 7px 8px;
      }

      .value {
        font-size: 15px;
      }

      .history-content {
  font-size: 15px;
}
      
      .arrow {
        right: 16px;
      }
    }
  </style>
</head>


<body>

  <main class="container">

    <!-- ============================
         ヘッダー
    ============================= -->

    <div class="header">

      <h1 class="title">
        車両検索
      </h1>

    </div>


    <!-- ============================
         検索
    ============================= -->

    <div class="search-area">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="登録番号を入力"
      >

    </div>


    <!-- ============================
         検索状態
    ============================= -->

    <div id="status"></div>


    <!-- ============================
         検索結果
    ============================= -->

    <div id="results"></div>

  </main>


  <script>

    // =========================================================
    // 設定
    // =========================================================

    //車両検索
    const SEARCH_API_URL = "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/10fd962b222f4bab947db7f2043a2173/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=y7tFxGxuDfJFJM4ExAF14D-DdV7Y3q7AvJzPXCgK44g";

    // 対応履歴取得
    const HISTORY_API_URL = "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/8e2c8217ed224cf39c19df016ace6f73/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=u4ZWV2byxn9qOV8sLU4RII0MBRn1HMYaw-Ff7gv7rfQ";
    
    // =========================================================
    // DOM
    // =========================================================

    const searchInput =
      document.getElementById("searchInput");

    const results =
      document.getElementById("results");

    const status =
      document.getElementById("status");


// =========================================================
// Enterキーで検索
// =========================================================

searchInput.addEventListener("keydown", (event) => {

  if (event.key !== "Enter") {
    return;
  }

  event.preventDefault();

  const keyword =
    searchInput.value.trim();

  if (!keyword) {

    results.innerHTML = "";
    status.textContent = "";

    return;
  }

  searchVehicle(keyword);

});

// =========================================================
// 車両検索
// =========================================================

async function searchVehicle(keyword) {

  status.textContent = "検索中...";
  results.innerHTML = "";

  try {

const response = await fetch(SEARCH_API_URL, {

  method: "POST",

  headers: {
    "Content-Type": "application/json"
  },

  body: JSON.stringify({
    keyword: keyword
  })

});

    if (!response.ok) {

      throw new Error(
        `HTTPエラー: ${response.status}`
      );

    }


    const data =
      await response.json();


    console.log(
      "Power Automateからの応答:",
      data
    );


    renderResults(
      data.records
    );

  }

  catch (error) {

    console.error(
      "検索エラー:",
      error
    );


    status.textContent =
      "検索中にエラーが発生しました。";

  }

}


    // =========================================================
    // 検索結果表示
    // =========================================================

    function renderResults(records) {

      results.innerHTML = "";


      // =======================================================
      // 0件
      // =======================================================

      if (
        !records ||
        records.length === 0
      ) {

        status.textContent = "";


        results.innerHTML = `
          <div class="no-result">
            該当する車両はありません。
          </div>
        `;


        return;

      }


      // =======================================================
      // 件数
      // =======================================================

      status.textContent =
        `${records.length}件見つかりました`;


      // =======================================================
      // カード生成
      // =======================================================

      records.forEach(record => {


        const card =
          document.createElement("div");


        card.className =
          "result-card";


        /*
         * kintoneのレコード番号
         *
         * 画面には表示しない。
         * 各カード内部に保持する。
         */

        card.dataset.recordId =
          record.recordId;


        card.innerHTML = `

<div class="registration">

  ${escapeHtml(
    record.registrationNumber
  )}

  <span class="registration-separator">
    /
  </span>

  ${escapeHtml(
    record.carName
  )}

</div>


<div class="info-grid">


  <div class="label">
    担当SS
  </div>

  <div class="value">

    ${escapeHtml(
      record.ss
    )}

  </div>


  <div class="label">
    属性
  </div>

  <div class="value">

    ${escapeHtml(
      record.attribute
    )}

  </div>


  <div class="label">
    氏名
  </div>

  <div class="value">

    ${escapeHtml(
      record.name
    )}

  </div>


<div class="label">
  車検満了日
</div>

<div class="value">

  ${escapeHtml(
    formatInspectionDate(record.inspectionDate)
  )}

</div>

</div>

          <div class="arrow">
  ›
</div>

<div class="action-buttons">

  <button
    type="button"
    class="action-button"
    data-action="customer-master"
  >
    顧客マスタ確認
  </button>

  <button
    type="button"
    class="action-button"
    data-action="create-history"
  >
    対応履歴作成
  </button>

  <button
    type="button"
    class="action-button"
    data-action="line-talk"
  >
    LINEトーク
  </button>

</div>

`;

// =====================================================
// カードクリック
// 対応履歴を取得・表示
// =====================================================

card.addEventListener(
  "click",
  async () => {

    const recordId =
      card.dataset.recordId;

    // すでに履歴表示済みなら閉じる
    const existingHistory =
      card.querySelector(".history-area");

    if (existingHistory) {

      existingHistory.remove();

      return;

    }


    // 読み込み中表示
    const loading =
      document.createElement("div");

loading.className = "history-area";

loading.innerHTML = `
  <div class="history-loading">
    対応履歴を読み込んでいます...
  </div>
`;

card.appendChild(loading);

    try {

      const response = await fetch(
        HISTORY_API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            vehicleId: recordId
          })

        }
      );


      if (!response.ok) {

        throw new Error(
          `HTTPエラー: ${response.status}`
        );

      }


      const data =
        await response.json();


      const histories =
        data.histories || [];


      // 履歴0件
      if (histories.length === 0) {

        loading.innerHTML = `
          <div class="history-title">
            対応履歴
          </div>

          <div class="history-empty">
            対応履歴はありません。
          </div>
        `;

        return;

      }


      // 履歴HTML作成
      const historyHtml =
        histories.map(history => `

          <div class="history-item">

  <div class="history-content">
    ${escapeHtml(
      history.content
    )}
  </div>

</div>
        `).join("");


      loading.innerHTML = `

  <div class="action-buttons">

    <button
      type="button"
      class="action-button"
      data-action="customer-master"
    >
      顧客マスタ確認
    </button>

    <button
      type="button"
      class="action-button"
      data-action="create-history"
    >
      対応履歴作成
    </button>

    <button
      type="button"
      class="action-button"
      data-action="line-talk"
    >
      LINEトーク
    </button>

  </div>

  <div class="history-title">
    対応履歴
  </div>

  <div class="history-list">
    ${historyHtml}
  </div>

`;
      
    }

    catch (error) {

      console.error(
        "対応履歴取得エラー:",
        error
      );


      loading.innerHTML = `
        <div class="history-error">
          対応履歴を取得できませんでした。
        </div>
      `;

    }

  }
);
        
        results.appendChild(card);

      });

    }

    // =========================================================
// 車検満了日表示
// 西暦 → 和暦＋西暦
// =========================================================

function formatInspectionDate(value) {

  if (!value) {
    return "";
  }

  const parts = value.split("-");

  if (parts.length !== 3) {
    return value;
  }

  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);

  const date = new Date(
    year,
    month - 1,
    day
  );

  const wareki = new Intl.DateTimeFormat(
    "ja-JP-u-ca-japanese",
    {
      era: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);

  const seireki =
    `${year}年${month}月${day}日`;

  return `${wareki}（${seireki}）`;
}

// =========================================================
// 検索文字正規化
// =========================================================

function normalizeText(value) {
      return String(
        value ?? ""
      )
        .normalize("NFKC")
        .replace(/\s+/g, "")
        .toLowerCase();

    }


    // =========================================================
    // HTMLエスケープ
    // =========================================================

    function escapeHtml(value) {

      const div =
        document.createElement("div");


      div.textContent =
        value ?? "";


      return div.innerHTML;

    }

  </script>

</body>
</html>
