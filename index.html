<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両検索</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #ffffff;
      color: #333;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0;
    }

    /* ==============================
       ヘッダー
    ============================== */

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      margin: 0;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ==============================
       検索エリア
    ============================== */

    .search-area {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      top: 30px;
      left: 20px;
      transform: translateY(-50%);
      color: #00b84f;
      font-size: 22px;
      pointer-events: none;
      z-index: 2;
    }

    #searchInput {
      width: 100%;
      height: 60px;
      padding: 0 25px 0 55px;

      border: 2px solid #d5d5d5;
      border-radius: 30px;

      background: #fff;
      color: #333;

      font-size: 18px;

      outline: none;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    #searchInput:hover {
      border-color: #00c853;
    }

    #searchInput:focus {
      border-color: #00c853;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.05),
        0 0 0 4px rgba(0, 200, 83, 0.12);
    }

    #searchInput::placeholder {
      color: #aaa;
    }

    /* ==============================
       検索状態
    ============================== */

    #status {
      min-height: 26px;
      margin-top: 34px;

      color: #666;

      font-size: 14px;
      font-weight: 500;
    }


    /* ==============================
       検索結果
    ============================== */

    #results {
      display: grid;
      gap: 14px;
    }


    /* ==============================
       結果カード
    ============================== */

    .result-card {
      position: relative;

      background: #fff;

      border: 1px solid #e2e2e2;
      border-top: 5px solid #00c853;

      border-radius: 12px;

      padding: 20px 55px 20px 22px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        border-color 0.15s;
    }

    .result-card:hover {
      transform: translateY(-2px);

      border-top-color: #00b84f;

      box-shadow:
        0 6px 18px rgba(0, 184, 79, 0.14);
    }


    /* ==============================
       登録番号
    ============================== */

    .registration {
      margin-bottom: 16px;

      color: #00b84f;

      font-size: 23px;
      font-weight: 700;

      letter-spacing: 0.03em;
    }


    /* ==============================
       顧客・車両情報
    ============================== */

    .info-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px 12px;
      align-items: center;
    }

    .label {
      color: #888;
      font-size: 13px;
    }

    .value {
      color: #333;

      font-size: 16px;
      font-weight: 500;
    }

    /* ==============================
       カード右側矢印
    ============================== */

    .arrow {
      position: absolute;

      right: 22px;
      top: 50%;

      transform: translateY(-50%);

      color: #00b84f;

      font-size: 28px;
      font-weight: 300;
    }

    /* ==============================
   操作ボタン
============================== */

    .action-title {
  margin-bottom: 16px;

  color: #00b84f;

  font-size: 23px;
  font-weight: 700;

  letter-spacing: 0.03em;
}

.action-section {
  padding-bottom: 22px;
  border-bottom: 1px solid #e2e2e2;
}
    
.action-buttons {
  display: flex;
  gap: 10px;
  margin: 20px 0 4px;
}

.action-button {
  flex: 1;

  padding: 11px 10px;

  background: #ffffff;
  color: #00b84f;

  border: 2px solid #00b84f;
  border-radius: 8px;

  font-size: 14px;
  font-weight: 700;

  text-decoration: none;
  text-align: center;

  cursor: pointer;

  transition:
    background-color 0.15s,
    color 0.15s,
    transform 0.15s;
}
    
.action-button:hover {
  background: #00b84f;
  color: #ffffff;
  transform: translateY(-1px);
}

.action-button:active {
  transform: translateY(0);
}

    .action-button-disabled {
  color: #aaaaaa;
  background: #f5f5f5;
  border-color: #d5d5d5;

  cursor: not-allowed;

  opacity: 0.7;
}

.action-button-disabled:hover {
  color: #aaaaaa;
  background: #f5f5f5;
  border-color: #d5d5d5;

  transform: none;
}

    /* ==============================
   対応履歴作成フォーム
============================== */

.history-create-form {
  margin-top: 22px;
  padding-top: 22px;
  padding-bottom: 22px;

  border-bottom: 1px solid #e2e2e2;
}
    
.form-row {
  margin-bottom: 18px;
}

.form-label {
  display: block;

  margin-bottom: 9px;

  color: #00b84f;

  font-size: 16px;
  font-weight: 700;

  letter-spacing: 0.02em;
}
    
.form-datetime {
  color: #333;

  font-size: 16px;
  font-weight: 500;
}

.form-date-line {
  display: block;
  width: 100%;
  line-height: 1.6;
}

.form-time-line {
  display: block;
  width: 100%;
  line-height: 1.6;
}
    
    /* ==============================
   2列フォーム
============================== */

.form-two-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}


/* ==============================
   複数選択ドロップダウン
============================== */

.multi-select {
  position: relative;
}

.multi-select-button {
  width: 100%;
  min-height: 44px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 10px 13px;

  color: #333;
  background: #ffffff;

  border: 1px solid #d5d5d5;
  border-radius: 7px;

  font-family: inherit;
  font-size: 15px;
  font-weight: 500;

  cursor: pointer;

  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}

.multi-select-button:hover {
  border-color: #00b84f;
}

.multi-select.open .multi-select-button {
  border-color: #00b84f;

  box-shadow:
    0 0 0 3px rgba(0, 184, 79, 0.10);
}

.multi-select-arrow {
  margin-left: 10px;

  color: #00b84f;

  font-size: 11px;
}


/* メニュー */

.multi-select-menu {
  display: none;

  position: absolute;
  top: calc(100% + 5px);
  left: 0;

  width: 100%;
  max-height: 240px;

  overflow-y: auto;

  padding: 7px;

  background: #ffffff;

  border: 1px solid #d5d5d5;
  border-radius: 7px;

  box-shadow:
    0 6px 18px rgba(0, 0, 0, 0.12);

  z-index: 100;
}

.multi-select.open .multi-select-menu {
  display: block;
}


/* 選択肢 */

.multi-select-menu label {
  display: flex;
  align-items: center;

  gap: 9px;

  padding: 9px 8px;

  color: #333;

  font-size: 15px;
  font-weight: 500;

  border-radius: 5px;

  cursor: pointer;
}

.multi-select-menu label:hover {
  background: #f0f8f3;
}

.multi-select-menu input {
  width: 17px;
  height: 17px;

  accent-color: #00b84f;
}


.form-options {
  display: flex;
  flex-wrap: wrap;

  gap: 12px 22px;
}

.form-options label {
  display: flex;
  align-items: center;

  gap: 6px;

  color: #333;

  font-size: 16px;
  font-weight: 500;

  cursor: pointer;
}

.form-options input {
  width: 18px;
  height: 18px;

  accent-color: #00b84f;
}

.form-input,
.form-textarea {
  width: 100%;

  padding: 10px 12px;

  color: #333;
  background: #ffffff;

  border: 1px solid #d5d5d5;
  border-radius: 7px;

  font-family: inherit;
  font-size: 16px;

  outline: none;
}

.form-input:focus,
.form-textarea:focus {
  border-color: #00b84f;

  box-shadow:
    0 0 0 3px rgba(0, 184, 79, 0.10);
}

.form-textarea {
  resize: vertical;
  min-height: 100px;
}

.form-actions {
  display: flex;
  justify-content: flex-end;

  gap: 10px;

  margin-top: 20px;
}

.form-cancel-button,
.form-submit-button {
  padding: 10px 22px;

  border-radius: 7px;

  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}

.form-cancel-button {
  color: #666;
  background: #ffffff;

  border: 1px solid #cccccc;
}

.form-submit-button {
  color: #ffffff;
  background: #00b84f;

  border: 2px solid #00b84f;
}

.form-submit-button:hover {
  background: #00a447;
  border-color: #00a447;
}

    /* ==============================
   対応履歴
============================== */

.history-area {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #e2e2e2;
}

.history-title {
  margin-top: 22px;
  margin-bottom: 16px;

  color: #00b84f;

  font-size: 23px;
  font-weight: 700;

  letter-spacing: 0.03em;
}
    
.history-list {
  display: grid;
  gap: 0;
}

.history-item {
  padding: 12px 0;
  border-bottom: 1px solid #eeeeee;
}

.history-item:last-child {
  border-bottom: none;
}

.history-content {
  color: #333;

  font-size: 16px;
  font-weight: 500;

  line-height: 1.6;
  white-space: pre-wrap;
}

.history-loading,
.history-empty {
  color: #777;
  font-size: 14px;
}

.history-error {
  color: #c62828;
  font-size: 14px;
}

    /* ==============================
       0件
    ============================== */

    .no-result {
      padding: 35px 20px;

      text-align: center;

      color: #777;
      background: #fff;

      border: 1px solid #e2e2e2;
      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* ==============================
       スマホ
    ============================== */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 24px);
        padding: 38px 0;
      }

      .title {
        font-size: 25px;
      }

      #searchInput {
        height: 56px;
        font-size: 16px;
      }

      .search-icon {
        top: 28px;
      }

      .result-card {
        padding:
          18px
          45px
          18px
          18px;
      }

      .registration {
        font-size: 20px;
      }

      .history-title {
  font-size: 20px;
}

      .action-title {
  font-size: 20px;
}

      .info-grid {
        grid-template-columns: 65px 1fr;
        gap: 7px 8px;
      }

      .value {
        font-size: 15px;
      }

      .history-content {
  font-size: 15px;
}
      
      .arrow {
        right: 16px;
      }

      .form-two-columns {
  grid-template-columns: 1fr;
  gap: 0;
}
      
    }
  </style>
</head>


<body>

  <main class="container">

    <!-- ============================
         ヘッダー
    ============================= -->

    <div class="header">

      <h1 class="title">
        車両検索
      </h1>

    </div>


    <!-- ============================
         検索
    ============================= -->

    <div class="search-area">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="登録番号を入力"
      >

    </div>


    <!-- ============================
         検索状態
    ============================= -->

    <div id="status"></div>


    <!-- ============================
         検索結果
    ============================= -->

    <div id="results"></div>

  </main>


  <script>

    // =========================================================
    // 設定
    // =========================================================

    //車両検索
    const SEARCH_API_URL = "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/10fd962b222f4bab947db7f2043a2173/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=y7tFxGxuDfJFJM4ExAF14D-DdV7Y3q7AvJzPXCgK44g";

    // 対応履歴取得
    const HISTORY_API_URL = "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/8e2c8217ed224cf39c19df016ace6f73/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=u4ZWV2byxn9qOV8sLU4RII0MBRn1HMYaw-Ff7gv7rfQ";

    // 対応履歴登録
    const HISTORY_CREATE_API_URL = "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/72e5f493229145af802abe15c29eef53/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=FmKezmthhBdyE5Y3Z-7nZ3sRsvC_FKeDf-e8Hghsous";
    
    // =========================================================
    // DOM
    // =========================================================

    const searchInput =
      document.getElementById("searchInput");

    const results =
      document.getElementById("results");

    const status =
      document.getElementById("status");


// =========================================================
// Enterキーで検索
// =========================================================

searchInput.addEventListener("keydown", (event) => {

  if (event.key !== "Enter") {
    return;
  }

  event.preventDefault();

  const keyword =
    searchInput.value.trim();

  if (!keyword) {

    results.innerHTML = "";
    status.textContent = "";

    return;
  }

  searchVehicle(keyword);

});

// =========================================================
// 車両検索
// =========================================================

async function searchVehicle(keyword) {

  status.textContent = "検索中...";
  results.innerHTML = "";

  try {

const response = await fetch(SEARCH_API_URL, {

  method: "POST",

  headers: {
    "Content-Type": "application/json"
  },

  body: JSON.stringify({
    keyword: keyword
  })

});

    if (!response.ok) {

      throw new Error(
        `HTTPエラー: ${response.status}`
      );

    }


    const data =
      await response.json();


    console.log(
      "Power Automateからの応答:",
      data
    );


    renderResults(
      data.records
    );

  }

  catch (error) {

    console.error(
      "検索エラー:",
      error
    );


    status.textContent =
      "検索中にエラーが発生しました。";

  }

}

    // =========================================================
// 対応履歴取得
// =========================================================

async function fetchHistories(vehicleId) {

  const response = await fetch(
    HISTORY_API_URL,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        vehicleId: vehicleId
      })
    }
  );


  if (!response.ok) {

    throw new Error(
      `HTTPエラー: ${response.status}`
    );

  }


  const data =
    await response.json();


  return data.histories || [];

}


// =========================================================
// 対応履歴HTML生成
// =========================================================

function createHistoryHtml(histories) {

  if (!histories || histories.length === 0) {

    return `
      <div class="history-empty">
        対応履歴はありません。
      </div>
    `;

  }


  return histories.map(history => `

    <div class="history-item">

      <div class="history-content">
        ${escapeHtml(
          history.content
        )}
      </div>

    </div>

  `).join("");

}

    // =========================================================
    // 検索結果表示
    // =========================================================

    function renderResults(records) {

      results.innerHTML = "";


      // =======================================================
      // 0件
      // =======================================================

      if (
        !records ||
        records.length === 0
      ) {

        status.textContent = "";


        results.innerHTML = `
          <div class="no-result">
            該当する車両はありません。
          </div>
        `;


        return;

      }


      // =======================================================
      // 件数
      // =======================================================

      status.textContent =
  `検索結果：${records.length}件`;


      // =======================================================
      // カード生成
      // =======================================================

      records.forEach(record => {


        const card =
          document.createElement("div");


        card.className =
          "result-card";


        /*
         * kintoneのレコード番号
         *
         * 画面には表示しない。
         * 各カード内部に保持する。
         */

        card.dataset.recordId =
          record.recordId;


        card.innerHTML = `

<div class="registration">

  ${escapeHtml(
    record.registrationNumber
  )}

  <span class="registration-separator">
    /
  </span>

  ${escapeHtml(
    record.carName
  )}

</div>


<div class="info-grid">


  <div class="label">
    担当SS
  </div>

  <div class="value">

    ${escapeHtml(
      record.ss
    )}

  </div>


  <div class="label">
    属性
  </div>

  <div class="value">

    ${escapeHtml(
      record.attribute
    )}

  </div>


  <div class="label">
    氏名
  </div>

  <div class="value">

    ${escapeHtml(
      record.name
    )}

  </div>


<div class="label">
  車検満了日
</div>

<div class="value">

  ${escapeHtml(
    formatInspectionDate(record.inspectionDate)
  )}

</div>

</div>

          <div class="arrow">
  ›
</div>

`;

// =====================================================
// カードクリック
// 対応履歴を取得・表示
// =====================================================

card.addEventListener(
  "click",
  async () => {

    const recordId =
      card.dataset.recordId;

    // すでに履歴表示済みなら閉じる
    const existingHistory =
      card.querySelector(".history-area");

    if (existingHistory) {

      existingHistory.remove();

      return;

    }


    // 読み込み中表示
    const loading =
      document.createElement("div");

loading.className = "history-area";

loading.innerHTML = `
  <div class="history-loading">
    対応履歴を読み込んでいます...
  </div>
`;

card.appendChild(loading);

    try {

      const histories =
  await fetchHistories(recordId);


      // 履歴0件
      if (histories.length === 0) {

        loading.innerHTML = `
          <div class="history-title">
            対応履歴
          </div>

          <div class="history-empty">
            対応履歴はありません。
          </div>
        `;

        return;

      }


      // 履歴HTML作成
      const historyHtml =
        histories.map(history => `

          <div class="history-item">

  <div class="history-content">
    ${escapeHtml(
      history.content
    )}
    
  </div>

</div>
        `).join("");


loading.innerHTML = `

  <div class="action-section">

    <div class="action-title">
      各種ボタン
    </div>

    <div class="action-buttons">

      <a
  href="https://ogakame.cybozu.com/k/49/show#record=${encodeURIComponent(recordId)}"
  target="_blank"
  rel="noopener noreferrer"
  class="action-button"
>
  顧客マスタ確認
</a>

<button
  type="button"
  class="action-button history-create-button"
>
  対応履歴作成
</button>

${record.lineTalkUrl
  ? `
    <a
      href="${escapeHtml(record.lineTalkUrl)}"
      target="_blank"
      rel="noopener noreferrer"
      class="action-button"
    >
      LINEトーク
    </a>
  `
  : `
    <button
      type="button"
      class="action-button action-button-disabled"
      disabled
    >
      LINEトーク
    </button>
  `
}

    </div>

  </div>


  <div class="history-title">
    対応履歴
  </div>

  <div class="history-list">
    ${historyHtml}
  </div>

`;

      // =====================================================
// 対応履歴作成ボタン
// =====================================================

const historyCreateButton =
  loading.querySelector(".history-create-button");

historyCreateButton.addEventListener(
  "click",
  (event) => {

    // カードの開閉イベントへ伝播させない
    event.stopPropagation();


    // すでにフォームがあれば閉じる
    const existingForm =
      loading.querySelector(".history-create-form");

    if (existingForm) {

      existingForm.remove();

      return;

    }


    // フォームを開いた瞬間の日時を取得
    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1).padStart(2, "0");

    const day =
      String(now.getDate()).padStart(2, "0");

    const hour =
      String(now.getHours()).padStart(2, "0");

    const minute =
      String(now.getMinutes()).padStart(2, "0");


    const date =
      `${year}-${month}-${day}`;

    const time =
      `${hour}:${minute}`;


    // フォーム作成
    const form =
      document.createElement("div");

    form.className =
      "history-create-form";

    form.dataset.date =
      date;

    form.dataset.time =
      time;


    form.innerHTML = `

      <div class="history-title">
        対応履歴作成
      </div>


      <div class="form-row">

  <div class="form-label">
    対応日時
  </div>

  <div class="form-datetime">

    <div class="form-date-line">

// =========================================================
// 曜日取得
// =========================================================

function getJapaneseWeekday(year, month, day) {

  const date = new Date(
    Number(year),
    Number(month) - 1,
    Number(day)
  );

  const weekdays = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];

  return weekdays[
    date.getDay()
  ];

}
    
function formatInspectionDate(value) {

  if (!value) {
    return "";
  }

  const parts = value.split("-");

  if (parts.length !== 3) {
    return value;
  }

  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);

  const date = new Date(
    year,
    month - 1,
    day
  );

  const wareki = new Intl.DateTimeFormat(
    "ja-JP-u-ca-japanese",
    {
      era: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);

  const seireki =
    `${year}年${month}月${day}日`;

  return `${wareki}（${seireki}）`;
}

// =========================================================
// 検索文字正規化
// =========================================================

function normalizeText(value) {
      return String(
        value ?? ""
      )
        .normalize("NFKC")
        .replace(/\s+/g, "")
        .toLowerCase();

    }


    // =========================================================
    // HTMLエスケープ

    function escapeHtml(value) {

      const div =
        document.createElement("div");


      div.textContent =
        value ?? "";


      return div.innerHTML;

    }
