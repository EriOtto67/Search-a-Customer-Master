<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両検索</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #ffffff;
      color: #333;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0;
    }

    /* ==============================
       ヘッダー
    ============================== */

    /* ==============================
   SSログイン画面
============================== */

.auth-screen {
  width: 100%;
  min-height: 100vh;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  padding: 100px 20px 40px;

  background: #ffffff;
}

.auth-card {
  width: 100%;
  max-width: 420px;

  padding: 30px;

  background: #ffffff;

  border: 1px solid #e2e2e2;
  border-top: 5px solid #00c853;
  border-radius: 12px;

  box-shadow:
    0 3px 12px rgba(0, 0, 0, 0.10);
}

.auth-title {
  margin-bottom: 12px;

  color: #00b84f;

  font-size: 26px;
  font-weight: 700;

  text-align: center;
  letter-spacing: 0.04em;
}

.auth-description {
  margin-bottom: 24px;

  color: #666666;

  font-size: 14px;
  line-height: 1.6;

  text-align: center;
}

.auth-label {
  display: block;

  margin-bottom: 8px;

  color: #333333;

  font-size: 15px;
  font-weight: 700;
}

.auth-input {
  width: 100%;
  height: 50px;

  padding: 10px 14px;

  color: #333333;
  background: #ffffff;

  border: 1px solid #cccccc;
  border-radius: 7px;

  font-family: inherit;
  font-size: 17px;

  outline: none;

  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}

.auth-input:focus {
  border-color: #00b84f;

  box-shadow:
    0 0 0 3px rgba(0, 184, 79, 0.10);
}

.auth-message {
  min-height: 22px;

  margin-top: 8px;

  color: #d93025;

  font-size: 14px;
  line-height: 1.5;

  text-align: center;
}

.auth-button {
  width: 100%;
  height: 50px;

  margin-top: 10px;

  color: #ffffff;
  background: #00b84f;

  border: 2px solid #00b84f;
  border-radius: 7px;

  font-family: inherit;
  font-size: 16px;
  font-weight: 700;

  cursor: pointer;

  transition:
    background-color 0.15s,
    border-color 0.15s;
}

.auth-button:hover {
  background: #00a447;
  border-color: #00a447;
}

.auth-button:disabled {
  color: #ffffff;
  background: #8bcfa8;
  border-color: #8bcfa8;

  cursor: wait;
}
    
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      margin: 0;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ==============================
       検索エリア
    ============================== */

    .search-area {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
    }

    .search-icon {
      position: absolute;
      top: 30px;
      left: 20px;
      transform: translateY(-50%);
      color: #00b84f;
      font-size: 22px;
      pointer-events: none;
      z-index: 2;
    }

    #searchInput {
      width: 100%;
      height: 60px;
      padding: 0 25px 0 55px;

      border: 2px solid #d5d5d5;
      border-radius: 30px;

      background: #fff;
      color: #333;

      font-size: 18px;

      outline: none;

      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    #searchInput:hover {
      border-color: #00c853;
    }

    #searchInput:focus {
      border-color: #00c853;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.05),
        0 0 0 4px rgba(0, 200, 83, 0.12);
    }

    #searchInput::placeholder {
      color: #aaa;
    }

    /* ==============================
       検索状態
    ============================== */

    #status {
      min-height: 26px;
      margin-top: 34px;

      color: #666;

      font-size: 14px;
      font-weight: 500;
    }


    /* ==============================
       検索結果
    ============================== */

    #results {
      display: grid;
      gap: 14px;
    }


    /* ==============================
       結果カード
    ============================== */

    .result-card {
      position: relative;

      background: #fff;

      border: 1px solid #e2e2e2;
      border-top: 5px solid #00c853;

      border-radius: 12px;

      padding: 20px 55px 20px 22px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        border-color 0.15s;
    }

    .result-card:hover {
      transform: translateY(-2px);

      border-top-color: #00b84f;

      box-shadow:
        0 6px 18px rgba(0, 184, 79, 0.14);
    }


    /* ==============================
       登録番号
    ============================== */

    .registration {
      margin-bottom: 16px;

      color: #00b84f;

      font-size: 23px;
      font-weight: 700;

      letter-spacing: 0.03em;
    }


    /* ==============================
       顧客・車両情報
    ============================== */

    .info-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px 12px;
      align-items: center;
    }

    .label {
      color: #888;
      font-size: 13px;
    }

    .value {
      color: #333;

      font-size: 16px;
      font-weight: 500;
    }

    /* ==============================
       カード右側矢印
    ============================== */

    .arrow {
      position: absolute;

      right: 22px;
      top: 50%;

      transform: translateY(-50%);

      color: #00b84f;

      font-size: 28px;
      font-weight: 300;
    }

    /* ==============================
   操作ボタン
============================== */

    .action-title {
  margin-bottom: 16px;

  color: #00b84f;

  font-size: 23px;
  font-weight: 700;

  letter-spacing: 0.03em;
}

.action-section {
  padding-bottom: 22px;
  border-bottom: 1px solid #e2e2e2;
}
    
.action-buttons {
  display: flex;
  gap: 10px;
  margin: 20px 0 4px;
}

.action-button {
  flex: 1;

  padding: 11px 10px;

  background: #ffffff;
  color: #00b84f;

  border: 2px solid #00b84f;
  border-radius: 8px;

  font-size: 14px;
  font-weight: 700;

  text-decoration: none;
  text-align: center;

  cursor: pointer;

  transition:
    background-color 0.15s,
    color 0.15s,
    transform 0.15s;
}
    
.action-button:hover {
  background: #00b84f;
  color: #ffffff;
  transform: translateY(-1px);
}

.action-button:active {
  transform: translateY(0);
}

    .action-button-disabled {
  color: #aaaaaa;
  background: #f5f5f5;
  border-color: #d5d5d5;

  cursor: not-allowed;

  opacity: 0.7;
}

.action-button-disabled:hover {
  color: #aaaaaa;
  background: #f5f5f5;
  border-color: #d5d5d5;

  transform: none;
}

    /* ==============================
   対応履歴作成フォーム
============================== */

.history-create-form {
  margin-top: 22px;
  padding-top: 22px;
  padding-bottom: 22px;

  border-bottom: 1px solid #e2e2e2;
}
    
.form-row {
  margin-bottom: 18px;
}

.form-label {
  display: block;

  margin-bottom: 9px;

  color: #00b84f;

  font-size: 16px;
  font-weight: 700;

  letter-spacing: 0.02em;
}

.form-required {
  display: inline-block;

  margin-left: 6px;

  color: #e74c3c;

  font-size: 12px;
  font-weight: 700;

  vertical-align: middle;
}

.form-error-message {
  display: none;

  margin-top: 7px;

  color: #d93025;

  font-size: 13px;
  font-weight: 500;

  line-height: 1.5;
}

.form-error-message.is-visible {
  display: block;
}

.form-error {
  border-color: #d93025 !important;

  box-shadow:
    0 0 0 3px rgba(217, 48, 37, 0.10) !important;
}
    
.form-datetime {
  color: #333;

  font-size: 16px;
  font-weight: 500;
}

.form-date-line {
  display: block;
  width: 100%;
  line-height: 1.6;
}

.form-time-line {
  display: block;
  width: 100%;
  line-height: 1.6;
}
    
    /* ==============================
   2列フォーム
============================== */

.form-two-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}


/* ==============================
   複数選択ドロップダウン
============================== */

.multi-select {
  position: relative;
}

.multi-select-button {
  width: 100%;
  min-height: 44px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 10px 13px;

  color: #333;
  background: #ffffff;

  border: 1px solid #d5d5d5;
  border-radius: 7px;

  font-family: inherit;
  font-size: 15px;
  font-weight: 500;

  cursor: pointer;

  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}

.multi-select-button:hover {
  border-color: #00b84f;
}

.multi-select.open .multi-select-button {
  border-color: #00b84f;

  box-shadow:
    0 0 0 3px rgba(0, 184, 79, 0.10);
}

.multi-select-arrow {
  margin-left: 10px;

  color: #00b84f;

  font-size: 11px;
}


/* メニュー */

.multi-select-menu {
  display: none;

  position: absolute;
  top: calc(100% + 5px);
  left: 0;

  width: 100%;
  max-height: 240px;

  overflow-y: auto;

  padding: 7px;

  background: #ffffff;

  border: 1px solid #d5d5d5;
  border-radius: 7px;

  box-shadow:
    0 6px 18px rgba(0, 0, 0, 0.12);

  z-index: 100;
}

.multi-select.open .multi-select-menu {
  display: block;
}


/* 選択肢 */

.multi-select-menu label {
  display: flex;
  align-items: center;

  gap: 9px;

  padding: 9px 8px;

  color: #333;

  font-size: 15px;
  font-weight: 500;

  border-radius: 5px;

  cursor: pointer;
}

.multi-select-menu label:hover {
  background: #f0f8f3;
}

.multi-select-menu input {
  width: 17px;
  height: 17px;

  accent-color: #00b84f;
}


.form-options {
  display: flex;
  flex-wrap: wrap;

  gap: 12px 22px;
}

.form-options label {
  display: flex;
  align-items: center;

  gap: 6px;

  color: #333;

  font-size: 16px;
  font-weight: 500;

  cursor: pointer;
}

.form-options input {
  width: 18px;
  height: 18px;

  accent-color: #00b84f;
}

.form-input,
.form-textarea {
  width: 100%;

  padding: 10px 12px;

  color: #333;
  background: #ffffff;

  border: 1px solid #d5d5d5;
  border-radius: 7px;

  font-family: inherit;
  font-size: 16px;

  outline: none;
}

.form-input:focus,
.form-textarea:focus {
  border-color: #00b84f;

  box-shadow:
    0 0 0 3px rgba(0, 184, 79, 0.10);
}

.form-textarea {
  resize: vertical;
  min-height: 100px;
}

.form-actions {
  display: flex;
  justify-content: flex-end;

  gap: 10px;

  margin-top: 20px;
}

.form-cancel-button,
.form-submit-button {
  padding: 10px 22px;

  border-radius: 7px;

  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}

.form-cancel-button {
  color: #666;
  background: #ffffff;

  border: 1px solid #cccccc;
}

.form-submit-button {
  color: #ffffff;
  background: #00b84f;

  border: 2px solid #00b84f;
}

.form-submit-button:hover {
  background: #00a447;
  border-color: #00a447;
}

    /* ==============================
   対応履歴
============================== */

.history-area {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #e2e2e2;
}

.history-title {
  margin-top: 22px;
  margin-bottom: 16px;

  color: #00b84f;

  font-size: 23px;
  font-weight: 700;

  letter-spacing: 0.03em;
}
    
.history-list {
  display: grid;
  gap: 0;
}

.history-item {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  column-gap: 18px;
  align-items: start;

  padding: 18px 0;

  border-bottom: 1px solid #eeeeee;
}

.history-item:last-child {
  border-bottom: none;
}


/* 左側：日付＋時刻 */

.history-datetime {
  margin: 0;
  padding: 0;
}


/* 日付 */

.history-date {
  margin: 0;
  padding: 0;

  color: #333;

  font-size: 16px;
  font-weight: 600;

  line-height: 22px;
}


/* 時刻 */

.history-time {
  margin: 2px 0 0 0;
  padding: 0;

  color: #333;

  font-size: 16px;
  font-weight: 500;

  line-height: 22px;
}


/* 右側：対応内容 */

.history-content {
  min-width: 0;

  margin: 0;
  padding: 0;

  color: #333;

  font-size: 16px;
  font-weight: 600;

  line-height: 22px;

  white-space: pre-wrap;
}
    
    .history-loading,
.history-empty {
  color: #777;
  font-size: 14px;
}

.history-error {
  color: #c62828;
  font-size: 14px;
}

    /* ==============================
       0件
    ============================== */

    /* ==============================
   対応履歴登録用パスワード
============================== */

.history-password-overlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 1000;

  width: 100%;
  height: 100%;

  padding: 20px;

  background-color: rgba(0, 0, 0, 0.55);

  align-items: center;
  justify-content: center;

  cursor: default;
}

.history-password-overlay.is-open {
  display: flex;
}

.history-password-modal {
  width: 100%;
  max-width: 550px;

  padding: 38px 34px 34px;

  background-color: #ffffff;

  border-top: 5px solid #00c853;
  border-radius: 15px;

  box-shadow:
    0 10px 30px rgba(0, 0, 0, 0.30);
}

.history-password-title {
  margin: 0 0 24px;

  color: #00b84f;

  font-size: 24px;
  font-weight: 700;

  line-height: 1.4;
}

.history-password-description {
  margin: 0 0 28px;

  color: #666666;

  font-size: 18px;
  font-weight: 400;

  line-height: 1.7;
}

.history-password-label {
  display: block;

  margin-bottom: 12px;

  color: #333333;

  font-size: 18px;
  font-weight: 700;
}

.history-password-input {
  width: 100%;
  height: 64px;

  padding: 0 16px;

  color: #333333;
  background-color: #ffffff;

  border: 1px solid #00c853;
  border-radius: 9px;

  font-family: inherit;
  font-size: 19px;

  outline: none;

  box-shadow:
    0 0 0 2px rgba(0, 200, 83, 0.08);
}

.history-password-input::placeholder {
  color: #888888;
}

.history-password-input:focus {
  border-color: #00c853;

  box-shadow:
    0 0 0 3px rgba(0, 200, 83, 0.12);
}

.history-password-message {
  min-height: 22px;

  margin-top: 8px;

  color: #d93025;

  font-size: 14px;
  line-height: 1.5;
}

.history-password-message:empty {
  display: none;
}

.history-password-button-row {
  display: flex;

  gap: 12px;

  margin-top: 26px;
}

.history-password-button-row button {
  flex: 1;

  width: auto;
  height: 64px;

  margin: 0;
  padding: 0 18px;

  border: none;
  border-radius: 8px;

  font-family: inherit;
  font-size: 20px;
  font-weight: 700;

  cursor: pointer;
}

.history-password-cancel-button {
  color: #ffffff;
  background-color: #808080;
}

.history-password-cancel-button:hover {
  background-color: #707070;
}

.history-password-cancel-button:active {
  background-color: #666666;
}

.history-password-confirm-button {
  color: #ffffff;
  background-color: #00b84f;
}

.history-password-confirm-button:hover {
  background-color: #00a847;
}

.history-password-confirm-button:active {
  background-color: #008f3c;
}
    
    .no-result {
      padding: 35px 20px;

      text-align: center;

      color: #777;
      background: #fff;

      border: 1px solid #e2e2e2;
      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* ==============================
       スマホ
    ============================== */

@media (max-width: 600px) {

    .auth-screen {
    padding: 50px 12px 30px;
  }

  .auth-card {
    padding: 26px 20px;
  }

  .auth-title {
    font-size: 23px;
  }

  .container {
    width: calc(100% - 24px);
    padding: 38px 0;
  }

  .title {
    font-size: 25px;
  }

  #searchInput {
    height: 56px;
    font-size: 16px;
  }

  .search-icon {
    top: 28px;
  }

  .result-card {
    padding:
      18px
      45px
      18px
      18px;
  }

  .registration {
    font-size: 20px;
  }

  .history-title {
    font-size: 20px;
  }

  .action-title {
    font-size: 20px;
  }

  .info-grid {
    grid-template-columns: 65px 1fr;
    gap: 7px 8px;
  }

  .value {
    font-size: 15px;
  }

  .arrow {
    right: 16px;
  }

  .form-two-columns {
    grid-template-columns: 1fr;
    gap: 0;
  }


  /* ==============================
     対応履歴
  ============================== */

  .history-item {
    grid-template-columns: 1fr;
    row-gap: 8px;
  }

  .history-datetime {
    margin: 0;
    padding: 0;
  }

  .history-date {
    margin: 0;
    padding: 0;

    font-size: 15px;
    line-height: 22px;
  }

  .history-time {
    margin: 2px 0 0 0;
    padding: 0;

    font-size: 15px;
    line-height: 22px;
  }

  .history-content {
    margin: 0;
    padding: 0;

    font-size: 15px;
    line-height: 22px;
  }

}

  </style>
</head>


<body>

  <!-- =====================================================
       SSログイン画面
  ====================================================== -->

  <div
    id="authScreen"
    class="auth-screen"
  >

    <div class="auth-card">

      <div class="auth-title">
        車両検索
      </div>

<label
  for="authPassword"
  class="auth-label"
>
  パスワード
</label>

<input
  type="password"
  id="authPassword"
  class="auth-input"
  inputmode="numeric"
  pattern="[0-9]*"
  placeholder="パスワードを入力して下さい"
  autocomplete="off"
>
      
      <div
        id="authMessage"
        class="auth-message"
        aria-live="polite"
      ></div>

      <button
        type="button"
        id="authButton"
        class="auth-button"
      >
        ログイン
      </button>

    </div>

  </div>


  <!-- =====================================================
       車両検索画面
  ====================================================== -->

  <main
    id="mainPage"
    class="container"
    style="display: none;"
  >
    
    <!-- ============================
         ヘッダー
    ============================= -->

    <div class="header">

      <h1 class="title">
        車両検索
      </h1>

    </div>


    <!-- ============================
         検索
    ============================= -->

    <div class="search-area">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="登録番号を入力"
      >

    </div>


    <!-- ============================
         検索状態
    ============================= -->

    <div id="status"></div>


    <!-- ============================
         検索結果
    ============================= -->

    <div id="results"></div>

  </main>


  <!-- =====================================================
       対応履歴登録用パスワードポップアップ
  ====================================================== -->

  <div
    id="historyPasswordModal"
    class="history-password-overlay"
    aria-hidden="true"
  >

    <div
      class="history-password-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="historyPasswordModalTitle"
    >

      <div
        id="historyPasswordModalTitle"
        class="history-password-title"
      >
        対応履歴登録
      </div>

      <p class="history-password-description">
        対応履歴を登録するため、登録用パスワードを入力して下さい。
      </p>

      <label
        for="historyPasswordInput"
        class="history-password-label"
      >
        登録用パスワード
      </label>

      <input
        type="password"
        id="historyPasswordInput"
        class="history-password-input"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="登録用パスワードを入力して下さい"
        autocomplete="off"
      >

      <div
        id="historyPasswordMessage"
        class="history-password-message"
        aria-live="polite"
      ></div>

      <div class="history-password-button-row">

        <button
          type="button"
          id="historyPasswordCancelButton"

function requestHistoryPassword(
  initialMessage = ""
) {

  return new Promise(function (resolve) {

    historyPasswordInput.value = "";

    historyPasswordMessage.textContent =
      initialMessage;


    historyPasswordModal.classList.add(
      "is-open"
    );

    historyPasswordModal.setAttribute(
      "aria-hidden",
      "false"
    );


    setTimeout(function () {

      historyPasswordInput.focus();

    }, 0);


    function closeHistoryPasswordModal() {

      historyPasswordModal.classList.remove(
        "is-open"
      );

      historyPasswordModal.setAttribute(
        "aria-hidden",
        "true"
      );

      historyPasswordInput.value = "";

      historyPasswordMessage.textContent = "";

      historyPasswordConfirmButton.onclick =
        null;

      historyPasswordCancelButton.onclick =
        null;

      historyPasswordInput.onkeydown =
        null;

    }


    function confirmHistoryPassword() {

      const password =
        historyPasswordInput.value.trim();


      if (!password) {

        historyPasswordMessage.textContent =
          "パスワードを入力して下さい";

        historyPasswordInput.focus();

        return;

      }


      closeHistoryPasswordModal();

      resolve(password);

    }


    historyPasswordCancelButton.onclick =
      function () {

        closeHistoryPasswordModal();

        resolve(null);

      };


    historyPasswordConfirmButton.onclick =
      function () {

        confirmHistoryPassword();

      };


    historyPasswordInput.onkeydown =
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          confirmHistoryPassword();

        }


        if (event.key === "Escape") {

          event.preventDefault();

          closeHistoryPasswordModal();

          resolve(null);

        }

      };

  });

}

async function authenticateStaffSS() {

  const password =
    authPasswordInput.value.trim();


  // 未入力
  if (password === "") {

authMessage.textContent =
  "パスワードを入力して下さい";
    
    authPasswordInput.focus();

    return;

  }


  // 認証中
  authButton.disabled = true;

  authButton.textContent =
    "確認中です...";

  authMessage.textContent = "";


  try {

    const response =
      await fetch(
        AUTH_API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            password: password
          })
        }
      );


    if (!response.ok) {

      throw new Error(
        `認証HTTPエラー: ${response.status}`
      );

    }


    const result =
      await response.json();


    // ========================================
    // 認証失敗
    // ========================================

    if (result.success !== true) {

authMessage.textContent =
  "パスワードが違います。";
      
      authPasswordInput.value = "";

      authPasswordInput.focus();

      return;

    }


    // ========================================
    // 認証成功
    // ========================================

    authenticatedStaffSS =
      result.staffSS || "";

    authenticatedStaffSSDisplay =
      result.staffSSDisplay ||
      result.staffSS ||
      "";


    // 入力したSS番号を消す
    authPasswordInput.value = "";


    // ログイン画面を非表示
    authScreen.style.display =
      "none";


    // 車両検索画面を表示
    mainPage.style.display =
      "block";


    // ページ上部へ
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  catch (error) {

    console.error(
      "SS番号認証エラー:",
      error
    );


    authMessage.textContent =
      "認証処理に失敗しました。もう一度お試しください。";

  }


  finally {

    authButton.disabled = false;

    authButton.textContent =
      "ログイン";

  }

}

// =========================================================
// 対応履歴の日付表示
// =========================================================

function formatHistoryDate(value) {

  if (!value) {
    return "";
  }

  const parts =
    value.split("-");

  if (parts.length !== 3) {
    return value;
  }

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);


  return `${year}年${month}月${day}日（${getJapaneseWeekday(
    year,
    month,
    day
  )}）`;

}


// =========================================================
// 対応履歴の時刻表示
// =========================================================

function formatHistoryTime(value) {

  if (!value) {
    return "";
  }

  const parts =
    value.split(":");

  if (parts.length < 2) {
    return value;
  }

  const hour =
    Number(parts[0]);

  const minute =
    parts[1];


  return `${hour}時${minute}分`;

}
    
// =========================================================
// 曜日取得
// =========================================================

function getJapaneseWeekday(year, month, day) {

  const date = new Date(
    Number(year),
    Number(month) - 1,
    Number(day)
  );

  const weekdays = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];

  return weekdays[
    date.getDay()
  ];

}
    
function formatInspectionDate(value) {

  if (!value) {
    return "";
  }

  const parts = value.split("-");

  if (parts.length !== 3) {
    return value;
  }

  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);

  const date = new Date(
    year,
    month - 1,
    day
  );

  const wareki = new Intl.DateTimeFormat(
    "ja-JP-u-ca-japanese",
    {
      era: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  ).format(date);

  const seireki =
    `${year}年${month}月${day}日`;

  return `${wareki}（${seireki}）`;
}

// =========================================================
// 検索文字正規化
// =========================================================

function normalizeText(value) {
      return String(
        value ?? ""
      )
        .normalize("NFKC")
        .replace(/\s+/g, "")
        .toLowerCase();

    }


    // =========================================================
    // HTMLエスケープ
    // =========================================================

    function escapeHtml(value) {

      const div =
        document.createElement("div");


      div.textContent =
        value ?? "";


      return div.innerHTML;

    }
